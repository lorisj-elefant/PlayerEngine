plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group project.maven_group
version project.mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

compileJava {
    options.encoding = "UTF-8"
}

repositories {
    mavenCentral()
    maven {
         name = 'ParchmentMC'
         url = 'https://maven.parchmentmc.org'
    }

    mavenLocal()

    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:0.15.6"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.1+1.20.1"
}

shadowJar {
    configurations = [project.configurations.shadow]

    archiveBaseName.set('PlayerEngine')
    archiveClassifier.set('dev')

    from sourceSets.main.output

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }

    manifest {
        attributes(tasks.jar.manifest.attributes)
        attributes('MixinConfigs': 'mixins.playerengine.json')
    }
}

remapJar {
    dependsOn("shadowJar")
    archiveBaseName.set('PlayerEngine')
    archiveClassifier.set('')
    input.set(shadowJar.archiveFile)
}

java {
    withSourcesJar()
}

javadoc {
    options.addStringOption('Xwerror', '-quiet')
    options.linkSource true
    options.encoding "UTF-8"
    source = sourceSets.main.allJava
    classpath += sourceSets.main.compileClasspath
}

jar {
    from sourceSets.main.output

    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes(
                'MixinConfigs': 'mixins.playerengine.json',

                'Implementation-Title': 'PlayerEngine',
                'Implementation-Version': project.version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Xmaxerrs", "500000"]
}